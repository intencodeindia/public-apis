<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debug EPUB Viewer</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
    }
    button {
      padding: 10px;
    }
    #viewer {
      margin-top: 20px;
      min-height: 500px;
      border: 1px solid #ccc;
    }
    #epub-reader {
      width: 100%;
      height: 500px;
    }
    #controls {
      margin-top: 10px;
    }
    #book-info {
      margin-top: 20px;
      background: #eee;
      padding: 10px;
    }
  </style>

  <!-- JSZip and EPUB.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3/dist/epub.min.js"></script>
</head>
<body>

  <h2>🛠️ Debug EPUB Viewer</h2>
  <input type="text" id="fileUrl" value="https://archive.org/download/LinuxVoice/Linux-Voice-Issue-003.epub">
  <button onclick="loadEPUB()">Load EPUB</button>

  <div id="controls" style="display:none;">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>

  <div id="viewer">
    <div id="epub-reader"></div>
  </div>

  <div id="book-info"></div>

  <script>
    let book, rendition;

    async function loadEPUB() {
      const fileUrl = document.getElementById("fileUrl").value;
      const proxyUrl = "https://proffid.com/advanced-cors-proxy.php?url=" + encodeURIComponent(fileUrl);
      const viewer = document.getElementById("epub-reader");
      const info = document.getElementById("book-info");
      console.clear();

      console.log("[1] Starting EPUB load...");
      console.log("[2] Using proxy:", proxyUrl);

      try {
        viewer.innerHTML = "Loading book...";
        info.innerHTML = "";
        document.getElementById("controls").style.display = "none";

        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Failed to fetch EPUB file");

        const blob = await response.blob();
        console.log("[3] Blob size:", blob.size, "bytes");

        const blobUrl = URL.createObjectURL(blob);
        console.log("[4] Blob URL created:", blobUrl);

        // Clear previous
        viewer.innerHTML = "";

        // Load book
        book = ePub(blobUrl);
        console.log("[5] Book instance created");

        const metadata = await book.loaded.metadata;
        const spine = await book.loaded.spine;

        console.log("[6] Metadata:", metadata);
        console.log("[7] Chapters:", spine.items.length);

        rendition = book.renderTo("epub-reader", {
          width: "100%",
          height: "100%",
          flow: "paginated"
        });

        rendition.display();

        rendition.on("rendered", section => {
          console.log("[8] Rendered section:", section.href);
        });

        rendition.on("relocated", location => {
          console.log("[9] Moved to:", location.start.displayed.page, "/", location.end.displayed.page);
        });

        document.getElementById("controls").style.display = "block";

        // Show in DOM
        info.innerHTML = `
          <strong>Title:</strong> ${metadata.title}<br>
          <strong>Author:</strong> ${metadata.creator}<br>
          <strong>Language:</strong> ${metadata.language}<br>
          <strong>Chapters:</strong> ${spine.items.length}<br>
          <strong>Size:</strong> ${(blob.size / 1024 / 1024).toFixed(2)} MB
        `;

      } catch (err) {
        console.error("❌ Error:", err.message);
        viewer.innerHTML = `<p style="color:red;">${err.message}</p>`;
      }
    }

    function nextPage() {
      if (rendition) rendition.next();
    }

    function prevPage() {
      if (rendition) rendition.prev();
    }
  </script>

</body>
</html>
